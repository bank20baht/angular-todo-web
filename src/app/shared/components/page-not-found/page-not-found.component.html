<div
  class="flex flex-col items-center justify-center h-screen m-5 rounded-md text-gray-500"
>
  <div class="text-center text-6xl font-extrabold mb-4">404 Error</div>
  <div class="text-center text-3xl font-semibold mb-4">Page Not Found</div>
  <div class="text-center text-lg mb-8">
    Sorry, the page you are looking for doesn't exist.
  </div>
  <div class="flex flex-row gap-2">
    <button (click)="handleClickBackButton()" class="btn btn-outline">
      Back
    </button>
    @if (!checkToken()) {
      <button (click)="handleClickLoginButton()" class="btn btn-primary">
        Login
      </button>
    }
  </div>
</div>
